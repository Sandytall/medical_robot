version: '3.8'

services:
  ros2_robot:
    build: ./ros2_workspace
    container_name: mars_robot_ros2
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
    volumes:
      - ./config:/config:ro
      - ./ros2_workspace:/ros2_workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./shared_data:/shared_data
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=42
      - ROBOT_ENV=development
      - PYTHONPATH=/ros2_workspace/src
    working_dir: /ros2_workspace
    command: >
      bash -c "source /opt/ros/humble/setup.bash &&
               colcon build --packages-select mars_core mars_hardware mars_voice mars_behaviors &&
               source install/setup.bash &&
               ros2 launch mars_core mars_robot.launch.py"
    restart: unless-stopped

  wake_word_service:
    build:
      context: ./host_services
      dockerfile: Dockerfile.wake_word
    container_name: mars_wake_word
    network_mode: host
    devices:
      - "/dev/snd:/dev/snd"
    volumes:
      - ./config:/config:ro
      - /dev/shm:/dev/shm
    environment:
      - PULSE_SERVER=unix:${XDG_RUNTIME_DIR}/pulse/native
    restart: unless-stopped
    depends_on:
      - ros2_robot